name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the complete backend suite
        run: python -m pytest tests/ -q

      - name: Verify imports and dependency consistency
        run: |
          python -m compileall -q src tests
          python -m pip check

      - name: Smoke-test the installed CLI
        run: |
          roboweaver robots > "${RUNNER_TEMP}/robots.txt"
          roboweaver nexus list > "${RUNNER_TEMP}/packages.txt"
          test -s "${RUNNER_TEMP}/robots.txt"
          test -s "${RUNNER_TEMP}/packages.txt"

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked dependency tree
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build the production frontend
        run: npm run build

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit Python project dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --progress-spinner off .

  package:
    name: Python distribution
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the source distribution and wheel
        run: |
          python -m pip install build==1.5.0
          python -m build

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          roboweaver robots > "${RUNNER_TEMP}/wheel-robots.txt"
          test -s "${RUNNER_TEMP}/wheel-robots.txt"

  containers:
    name: Containers${{ startsWith(github.ref, 'refs/tags/v') && ' / publish' || '' }}
    needs: [backend, frontend, package, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build API image
        run: docker build --tag roboweaver-api:ci .

      - name: Build frontend image
        run: docker build --tag roboweaver-frontend:ci ./frontend

      - name: Smoke-test the authenticated stack
        env:
          ROBOWEAVER_API_TOKEN: ci-only-token-0123456789abcdef0123456789abcdef
        run: |
          cleanup() { docker compose down --volumes; }
          trap cleanup EXIT
          docker compose up --detach --build
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/api/roboweaver/api/version
          curl --fail http://127.0.0.1:8080/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/version)" = "401"

      - name: Authenticate to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish versioned images
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag roboweaver-api:ci "${image_prefix}-api:${GITHUB_REF_NAME}"
          docker tag roboweaver-api:ci "${image_prefix}-api:latest"
          docker tag roboweaver-frontend:ci "${image_prefix}-frontend:${GITHUB_REF_NAME}"
          docker tag roboweaver-frontend:ci "${image_prefix}-frontend:latest"
          docker push "${image_prefix}-api:${GITHUB_REF_NAME}"
          docker push "${image_prefix}-api:latest"
          docker push "${image_prefix}-frontend:${GITHUB_REF_NAME}"
          docker push "${image_prefix}-frontend:latest"
