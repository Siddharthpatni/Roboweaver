name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.lock
          python -m pip install -e . --no-deps

      - name: Run Python static analysis
        run: python -m ruff check src tests scripts --select C901,F

      - name: Run the complete backend suite
        run: python -m pytest tests/ -q

      - name: Enforce backend branch coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ -q --cov=roboweaver --cov-branch --cov-report=term-missing --cov-fail-under=75

      - name: Verify imports and dependency consistency
        run: |
          python -m compileall -q src tests
          python -m pip check

      - name: Smoke-test the installed CLI
        run: |
          roboweaver robots > "${RUNNER_TEMP}/robots.txt"
          roboweaver nexus list > "${RUNNER_TEMP}/packages.txt"
          test -s "${RUNNER_TEMP}/robots.txt"
          test -s "${RUNNER_TEMP}/packages.txt"

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for browser-to-compiler acceptance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the compiler for browser acceptance
        working-directory: .
        run: python -m pip install -e .

      - name: Install the locked dependency tree
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the production frontend
        run: npm run build

      - name: Install Chromium for responsive visual QA
        run: npx playwright install --with-deps chromium

      - name: Verify 13-inch and 32-inch viewport profiles
        run: |
          roboweaver dashboard --port 8080 --no-self-heal > "${RUNNER_TEMP}/roboweaver-api.log" 2>&1 &
          backend_pid=$!
          ROBOWEAVER_LAN_MODE=1 npm run start > "${RUNNER_TEMP}/roboweaver-frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill ${frontend_pid} ${backend_pid}' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null && \
              curl --fail --silent http://127.0.0.1:3000 >/dev/null && break
            sleep 1
          done
          ROBOWEAVER_VISUAL_REQUIRE_COMPILER=1 ROBOWEAVER_VISUAL_EXPECT_ACCESS_MODE=lan npm run test:visual

      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: responsive-visual-qa
          path: frontend/test-results/visual
          if-no-files-found: warn

  native-mlir:
    name: Upstream LLVM/MLIR acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install upstream MLIR tools
        run: sudo apt-get update && sudo apt-get install --yes mlir-18-tools

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install RoboWeaver
        run: python -m pip install -e .

      - name: Require a native mlir-opt compile
        env:
          ROBOWEAVER_MLIR_MODE: required
          ROBOWEAVER_MLIR_OPT: mlir-opt-18
        run: python scripts/verify_native_mlir.py

  ros2-artifact:
    name: Generated ROS 2 package / Humble colcon
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy@sha256:7bea3d9aa2483d3ca34c8e30d921b79273b0913bd7dc64bebf51d082b5d107e4
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate package from verified RoboIR
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mkdir -p "${RUNNER_TEMP}/generated_ws/src"
          python3 scripts/generate_ros2_ci_package.py "${RUNNER_TEMP}/generated_ws/src"

      - name: Build generated package with colcon
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd "${RUNNER_TEMP}/generated_ws"
          colcon build --event-handlers console_direct+
          source install/setup.bash
          ros2 pkg executables roboweaver_pick_red_cube

  gazebo-acceptance:
    name: Gazebo Harmonic / ROS 2 Jazzy headless spawn
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble@sha256:da725acf8b0f9f30c683e33ffbdcd6482d077af96d6fdc7688c5f4f280b7d923
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Gazebo Harmonic integration and URDF tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes ros-jazzy-ros-gz-sim liburdfdom-tools

      - name: Generate, spawn, and inspect a compiler-derived model
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 scripts/generate_gazebo_ci_model.py "${RUNNER_TEMP}/franka_panda.urdf"
          scripts/check_ros_gazebo.sh "${RUNNER_TEMP}/franka_panda.urdf"

  research-evaluation:
    name: Reproducible research evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install RoboWeaver and run benchmark
        run: |
          python -m pip install -e .
          python scripts/run_research_evaluation.py --output research-results/evaluation.json

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: research-evaluation
          path: research-results/evaluation.json
          if-no-files-found: error

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned security scanners
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit Python project dependencies
        run: python -m pip_audit --progress-spinner off .

      - name: Scan Python source
        run: python -m bandit -r src -ll -ii -q

  package:
    name: Python distribution
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Build the source distribution and wheel
        run: |
          python -m pip install -r requirements-ci.lock
          python -m build --no-isolation

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install dist/*.whl --no-deps
          roboweaver robots > "${RUNNER_TEMP}/wheel-robots.txt"
          test -s "${RUNNER_TEMP}/wheel-robots.txt"

  containers:
    name: Containers${{ startsWith(github.ref, 'refs/tags/v') && ' / publish' || '' }}
    needs: [backend, frontend, native-mlir, ros2-artifact, gazebo-acceptance, research-evaluation, package, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build API image
        run: docker build --tag roboweaver-api:ci .

      - name: Build frontend image
        run: docker build --tag roboweaver-frontend:ci ./frontend

      - name: Smoke-test the authenticated stack
        env:
          ROBOWEAVER_API_TOKEN: ci-only-token-0123456789abcdef0123456789abcdef
        run: |
          cleanup() { docker compose down --volumes; }
          trap cleanup EXIT
          docker compose up --detach --build
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/api/roboweaver/api/version
          curl --fail http://127.0.0.1:8080/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/version)" = "401"

      - name: Authenticate to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish versioned images
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag roboweaver-api:ci "${image_prefix}-api:${GITHUB_REF_NAME}"
          docker tag roboweaver-api:ci "${image_prefix}-api:latest"
          docker tag roboweaver-frontend:ci "${image_prefix}-frontend:${GITHUB_REF_NAME}"
          docker tag roboweaver-frontend:ci "${image_prefix}-frontend:latest"
          docker push "${image_prefix}-api:${GITHUB_REF_NAME}"
          docker push "${image_prefix}-api:latest"
          docker push "${image_prefix}-frontend:${GITHUB_REF_NAME}"
          docker push "${image_prefix}-frontend:latest"
