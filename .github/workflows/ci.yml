name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install RoboWeaver (editable, with real deps)
        run: pip install -e ".[test]"

      - name: Run full backend verification suite
        # A hardcoded file list here previously meant new test files were
        # silently never run in CI unless someone remembered to add them --
        # which is exactly what happened to test_discovery.py,
        # test_connection_advisor.py and test_urdf_gen.py. Worse: those files
        # are plain pytest-style (no `if __name__` block), so the old
        # `python3 "$f"` invocation would have executed zero assertions and
        # exited 0 even if added to the list. `pytest tests/` auto-discovers
        # every test file, runs both styles correctly, and can't go stale.
        run: PYTHONPATH=src python3 -m pytest tests/ -v

      - name: Verify imports and installed dependency consistency
        run: |
          python3 -m compileall -q src tests
          python3 -m pip check

      - name: Build distributable artifacts
        if: matrix.python-version == '3.12'
        run: python3 -m build

      - name: Verify roboweaver CLI entrypoint installs and runs
        run: |
          roboweaver robots | head -5
          roboweaver nexus list | head -5

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
