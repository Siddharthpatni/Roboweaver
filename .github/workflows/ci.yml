name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install RoboWeaver (editable, with real deps)
        run: pip install -e .

      - name: Run full backend verification suite
        run: |
          for f in tests/test_roboweaver.py \
                   tests/test_multi_robot_choreography.py \
                   tests/test_universal_platform.py \
                   tests/test_prompt_builder.py \
                   tests/test_inspire_hand_rs485.py \
                   tests/test_inspire_simulation.py \
                   tests/test_inspire_hand_real_serial_protocol.py \
                   tests/test_ir.py; do
            echo "::group::$f"
            PYTHONPATH=src python3 "$f"
            echo "::endgroup::"
          done

      - name: Verify roboweaver CLI entrypoint installs and runs
        run: |
          roboweaver robots | head -5
          roboweaver nexus list | head -5

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
