[project]
name = "roboweaver"
version = "0.1.0"
description = "Compile Robotics Knowledge into Executable Intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.0,<4",
    "numpy>=1.24,<3",
    "imageio[ffmpeg]>=2.31,<3",
]
test = [
    "pytest>=7.0,<9",
    "build>=1.2,<2",
]

[project.scripts]
roboweaver = "roboweaver.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
