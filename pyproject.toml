[project]
name = "roboweaver"
version = "0.1.0"
description = "Compile Robotics Knowledge into Executable Intelligence"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim = [
    "mujoco>=3.0",
    "numpy>=1.24",
    "imageio[ffmpeg]>=2.31",
]

[project.scripts]
roboweaver = "roboweaver.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
